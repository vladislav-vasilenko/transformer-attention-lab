name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check research tests

      - name: Lint
        run: ruff check research tests

      - name: Run correctness suite
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
